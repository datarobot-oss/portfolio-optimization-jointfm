[project]
name = "portfolio-optimization-jointfm"
version = "0.1.0"
description = "JointFM scenario generator for NVIDIA's portfolio-optimization package"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
# NVIDIA's portfolio-optimization package is not on PyPI, so it is not declared
# here: install it from its repository first (README).
dependencies = [
    "jointfm-client==0.16.*",
    "numpy>=2.0",
    "pandas>=2.0",
    "pydantic>=2.12",
]

[project.entry-points."portfolio_optimization.scenario_generators"]
jointfm = "portfolio_optimization_jointfm.generator:generate"

[dependency-groups]
dev = [
    "portfolio-optimization",
    "pre-commit>=4",
    "pytest>=8",
    "ruff>=0.15",
]

[tool.uv.sources]
# The first revision with the scenario-generator extension point.
portfolio-optimization = { git = "https://github.com/NVIDIA-AI-Blueprints/portfolio-optimization.git", rev = "7d0bfc8326802c443b296270034e3259212f6450" }

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
