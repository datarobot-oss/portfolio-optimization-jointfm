fail_fast: true
default_install_hook_types: [pre-commit, commit-msg]
# Hooks without their own `stages` run only before a commit; the commit-msg
# stage then runs only the message check instead of every hook a second time.
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      # Commits land on main directly, so every subject feeds `cz bump` and the changelog.
      - id: commitizen
        name: commitizen (commit message)
        entry: uv run cz check --allow-abort --commit-msg-file
        language: system
        stages: [commit-msg]
      - id: insert-license
        name: insert license header (python)
        entry: apache/skywalking-eyes:0.8.0 -c .licenserc.yaml header fix
        language: docker_image
        pass_filenames: false
        require_serial: true
        always_run: true
      - id: ruff-check
        name: ruff lint
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: tests
        name: tests
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        always_run: true
