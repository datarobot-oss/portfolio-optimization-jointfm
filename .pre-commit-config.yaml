fail_fast: true

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff lint
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: tests
        name: tests
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        always_run: true
